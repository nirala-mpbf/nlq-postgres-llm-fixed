
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ${DB_PASSWORD:root@123}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Route LLM requests through Agent Gateway
  ai:
    openai:
      base-url: http://localhost:4000
      api-key: local-gateway
      chat:
        options:
          model: llama3.1:8b

    # Configure this only if your AI service uses
    # Spring AI's MCP client directly.
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            agentgateway:
              url: http://localhost:4000

server:
  port: 8080

rag:
  vector-table: nlq_schema_embeddings

lakefs:
  prompt-prefix: ${LAKEFS_PROMPT_PREFIX:prompts/ddod}

workflow:
  api:
    base-url: http://localhost:8081

mcp:
  block:
    # Gateway endpoint: confirm the MCP path in gateway config
    url: ${MCP_BLOCK_URL:http://localhost:4000/mcp}

logging:
  level:
    io.agentscope: DEBUG
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG

