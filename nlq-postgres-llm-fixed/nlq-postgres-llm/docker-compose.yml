services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nlq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: employee_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
